<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM 代理</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="page-shell narrow simple-auth-shell">
    <section class="panel inset simple-auth-panel">
      <div class="form-header">
        <div>
          <div id="authEyebrow" class="eyebrow">登录</div>
          <h1 id="authTitle" class="form-title">LLM 代理</h1>
        </div>
      </div>

      <p id="authHint" class="section-copy">使用已有用户账号登录，管理员账号也可以在这里登录。</p>

      <div class="inline-actions" style="margin: 18px 0 16px;">
        <button type="button" class="secondary-button" data-auth-mode="login" aria-pressed="true">登录</button>
        <button type="button" class="ghost-button" data-auth-mode="register" aria-pressed="false">创建账号</button>
      </div>

      <form id="authForm" class="form-grid">
        <label>
          <span>用户名</span>
          <input id="usernameInput" type="text" autocomplete="username" placeholder="请输入用户名" />
        </label>
        <label>
          <span>密码</span>
          <input id="passwordInput" type="password" autocomplete="current-password" placeholder="请输入密码" />
        </label>
        <label id="confirmPasswordField" hidden>
          <span>确认密码</span>
          <input id="confirmPasswordInput" type="password" autocomplete="new-password" placeholder="请再次输入密码" />
          <span class="field-note">用户名长度需为 3 到 32 个字符，密码至少 6 位。</span>
        </label>
        <div class="actions full-width">
          <button id="authSubmitButton" type="submit">继续</button>
        </div>
      </form>

      <div id="loginMessage" class="feedback"></div>
    </section>
  </div>

  <script type="module" src="/assets/auth.js"></script>
</body>
</html>
