services:
  postgres:
    image: "${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-llm_delegate}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - llm_delegate_dev_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-llm_delegate}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: "${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7}"
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - llm_delegate_dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  llm_delegate_dev_pg_data:
  llm_delegate_dev_redis_data:
